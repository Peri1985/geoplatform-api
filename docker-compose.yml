# Local services for development: PostGIS, Redis, RustFS (S3), Nominatim and Photon.
# Settings come from .env (copy .env.example). See the README, "Docker".
name: geoplatform

services:
  postgres:
    # Multi-arch build of the official PostGIS image (postgis/postgis is amd64 only)
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geoplatform}
      POSTGRES_USER: ${POSTGRES_USER:-geoplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoplatform}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage (see documentations/infrastructure/STORAGE.md)
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-geoplatform}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-geoplatform-secret}
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000" # S3 API
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - rustfs-data:/data
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # RustFS runs as uid 10001 and needs to own its volume (as in RustFS's own compose file)
  rustfs-permissions:
    image: alpine:3.24
    volumes:
      - rustfs-data:/data
    command: ["chown", "-R", "10001:10001", "/data"]
    restart: "no"

  # Creates the bucket once RustFS is up; does nothing if it already exists
  rustfs-init:
    image: amazon/aws-cli:2.38.1
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-geoplatform}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-geoplatform-secret}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${RUSTFS_BUCKET:-geoplatform}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$BUCKET"
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  nominatim:
    image: mediagis/nominatim:5.3
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/europe/greece-latest.osm.pbf}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:-https://download.geofabrik.de/europe/greece-updates/}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
      IMPORT_STYLE: full
      IMPORT_WIKIPEDIA: ${NOMINATIM_IMPORT_WIKIPEDIA:-false}
      THREADS: 4
      # The image defaults expect a large server (10GB maintenance_work_mem); sized here for ~8GB of Docker memory
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_MAINTENANCE_WORK_MEM: 1GB
      POSTGRES_AUTOVACUUM_WORK_MEM: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 2GB
    ports:
      - "127.0.0.1:${NOMINATIM_PORT:-8080}:8080"
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first import (Greece) takes tens of minutes
      start_period: 3h
    restart: unless-stopped

  photon:
    build: ./docker/photon
    environment:
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
      PHOTON_LANGUAGES: ${PHOTON_LANGUAGES:-el,en}
      JAVA_OPTS: -Xmx1g
    ports:
      - "127.0.0.1:${PHOTON_PORT:-2322}:2322"
    volumes:
      - photon-data:/photon/data
    depends_on:
      nominatim:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  nominatim-data:
  photon-data:
